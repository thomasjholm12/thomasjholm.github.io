<!DOCTYPE html>
<html>
<head>
  <title>Book Now | Gold Standard Detailing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: system-ui;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-weight: 600;
    }

    p {
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div>
  <h1 id="serviceTitle">Redirecting to Booking...</h1>
  <p>If you are not redirected automatically, please wait a moment.</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const service = params.get("service");

  const serviceTitle = document.getElementById("serviceTitle");

  let bookingUrl = "";

  if (service === "interior") {
    bookingUrl = "https://calendar.app.google/DbWcicNHoR2EBfK56";
    serviceTitle.textContent = "Opening Interior Detail Booking...";
  }

  if (service === "exterior") {
    bookingUrl = "https://calendar.app.google/uScWukMa9rRBaqwA9";
    serviceTitle.textContent = "Opening Exterior Detail Booking...";
  }

  if (service === "gold") {
    bookingUrl = "https://calendar.app.google/eZbzKT9eB8fZ2N1z6";
    serviceTitle.textContent = "Opening Gold Standard Service Booking...";
  }

  if (service === "full") {
    bookingUrl = "https://calendar.app.google/HDsozHxA1ippjnZQA";
    serviceTitle.textContent = "Opening Full Detail Booking...";
  }

  // fallback
  if (!bookingUrl) {
    bookingUrl = "https://calendar.app.google/DbWcicNHoR2EBfK56";
  }

  window.location.href = bookingUrl;
</script>

</body>
</html>
