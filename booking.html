<!DOCTYPE html>
<html>
<head>
  <title>Book Now | Gold Standard Detailing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: system-ui;
    }

    .booking-wrapper {
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="booking-wrapper">
    <h1 id="serviceTitle">Book Your Appointment</h1>

    <div class="calendly-inline-widget"
         id="calendlyWidget"
         style="min-width:320px;height:900px;">
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const service = params.get("service");

    const calendlyWidget = document.getElementById("calendlyWidget");
    const serviceTitle = document.getElementById("serviceTitle");

    let calendlyUrl = "";

    if (service === "interior") {
      calendlyUrl = "https://calendly.com/thomas-goldstandarddetailing/interior-detail";
      serviceTitle.textContent = "Book Interior Detail";
    }

    if (service === "exterior") {
      calendlyUrl = "https://calendly.com/thomas-goldstandarddetailing/exterior-detail";
      serviceTitle.textContent = "Book Exterior Detail";
    }

    if (service === "gold") {
      calendlyUrl = "https://calendly.com/thomas-goldstandarddetailing/gold-standard";
      serviceTitle.textContent = "Book Gold Standard Service";
    }
    if (service === "full") {
      calendlyUrl = "https://calendly.com/thomas-goldstandarddetailing/full-detail";
      serviceTitle.textContent = "Book Interior Detail";
    }

    // Fallback if no parameter
    if (!calendlyUrl) {
      calendlyUrl = "https://calendly.com/thomas-goldstandarddetailing/interior-detail";
    }

    calendlyWidget.setAttribute("data-url", calendlyUrl);
  </script>

  <script src="https://assets.calendly.com/assets/external/widget.js"></script>

</body>
</html>
