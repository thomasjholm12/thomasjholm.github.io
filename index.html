<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Standard Detailing</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #121212;
      --text-main: #e6e6e6;
      --text-muted: #b0b0b0;
      --gold: #d4af37;
    }

    body {
      margin: 0;
      background: var(--bg-main);
      color: var(--text-main);
      scroll-behavior: smooth;
    }

    /* ===== SPLASH ===== */
    .splash {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .splash video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(212,175,55,0.15),
        rgba(0,0,0,0.85)
      );
      z-index: 1;
    }

    /* ===== LOGO (START STATE) ===== */
    .main-logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.4);
      width: clamp(400px, 70vw, 1200px);
      transition: all 0.6s ease;
      z-index: 2000;
    }

    /* ===== NAV ===== */
    .navbar {
      position: fixed;
      width: 100%;
      top: 0;
      background: transparent;
      transition: 0.4s ease;
      padding: 30px 0;
      z-index: 1000;
    }

    .navbar.scrolled {
      background: rgba(18,18,18,0.95);
      backdrop-filter: blur(10px);
      padding: 10px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .nav-link {
      color: var(--text-muted) !important;
    }

    .nav-link:hover {
      color: var(--gold) !important;
    }

    /* ===== LOGO SHRINKED STATE ===== */
    .main-logo.shrink {
      top: 20px;
      left: 40px;
      transform: translate(0, 0) scale(0.35);
      width: auto;
    }

    /* ===== CONTENT ===== */
    section {
      padding: 120px 0;
    }

    .card {
      background: #1f1f1f;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 1rem 2rem rgba(0,0,0,0.6);
    }

    footer {
      background: #1f1f1f;
      padding: 30px 0;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

  </style>
</head>

<body>

  <!-- SPLASH -->
  <header class="splash">
    <video autoplay muted loop playsinline>
      <source src="Detailvid.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
  </header>

  <!-- MAIN LOGO (ONE ELEMENT) -->
  <img src="Banner.png" class="main-logo" id="mainLogo" alt="Gold Standard Logo">

  <!-- NAV -->
  <nav id="mainNav" class="navbar navbar-expand-lg">
    <div class="container justify-content-end">
      <ul class="navbar-nav gap-4">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- SERVICES -->
  <section>
    <div class="container">
      <h2 class="text-center mb-5">Our Services</h2>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Gold Standard Detail</h5>
            <p class="text-secondary">Our most comprehensive package.</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Interior Detailing</h5>
            <p class="text-secondary">Deep interior restoration.</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-4 text-center">
            <h5>Exterior Detailing</h5>
            <p class="text-secondary">Paint correction and protection.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    © <span id="year"></span> Thomas Holm. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const nav = document.getElementById("mainNav");
    const logo = document.getElementById("mainLogo");

    window.addEventListener("scroll", function() {
      if (window.scrollY > 100) {
        nav.classList.add("scrolled");
        logo.classList.add("shrink");
      } else {
        nav.classList.remove("scrolled");
        logo.classList.remove("shrink");
      }
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
