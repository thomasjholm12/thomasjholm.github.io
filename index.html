<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thomas Holm | Portfolio</title>
  <meta name="description" content="Website designed for the purposes of Gold Standard Detailing" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #121212;
      --bg-surface: #1f1f1f;
      --bg-surface-2: #242424;
      --text-main: #e6e6e6;
      --text-muted: #b0b0b0;
      --gold: #d4af37;
      --gold-muted: #bfa133;
      --border-subtle: rgba(255,255,255,0.08);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    /* ===== NAV ===== */
    nav {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-link {
      color: var(--text-muted) !important;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: var(--gold) !important;
    }

    /* Dropdown menu */
    .dropdown-menu {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      margin-top: 0;
    }

    .dropdown-item {
      color: var(--text-main);
    }

    .dropdown-item:hover {
      background-color: var(--bg-surface-2);
      color: var(--gold);
    }

    /* 🔥 OPEN DROPDOWN ON HOVER (DESKTOP ONLY) */
    @media (min-width: 992px) {
      .nav-item.dropdown:hover > .dropdown-menu {
        display: block;
      }

      .nav-item.dropdown:hover > .nav-link {
        color: var(--gold) !important;
      }
    }

    /* Prevent blue focus/active states */
    .nav-link:focus,
    .nav-link:active {
      color: var(--gold) !important;
      box-shadow: none;
      outline: none;
    }

    /* ===== Banner ===== */
    .banner-header {
      position: relative;
      height: clamp(140px, 18vw, 260px);
      overflow: hidden;
    }

    .banner-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(6px) brightness(0.45);
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(212,175,55,0.15),
        rgba(0,0,0,0.85)
      );
    }

    .banner-img {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      padding: 24px;
    }
  </style>
</head>

<body>

  <!-- Banner -->
  <header class="banner-header">
    <video class="banner-video" autoplay muted loop playsinline>
      <source src="Detailvid.mp4" type="video/mp4">
    </video>
    <div class="banner-overlay"></div>
    <img src="Banner.png" class="banner-img" alt="Banner">
  </header>

  <!-- Navigation -->
  <nav class="sticky-top">
    <div class="container py-2">
      <ul class="nav justify-content-center gap-4">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button">
            Services
          </a>
          <ul class="dropdown-menu text-center">
            <li><a class="dropdown-item" href="#">Gold Standard</a></li>
            <li><a class="dropdown-item" href="#">Silver Standard</a></li>
            <li><a class="dropdown-item" href="#">Bronze Standard</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Interior Service</a></li>
            <li><a class="dropdown-item" href="#">Exterior Service</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Add-Ons</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Projects</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>

      </ul>
    </div>
  </nav>

  <!-- Bootstrap JS (for mobile tap) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
