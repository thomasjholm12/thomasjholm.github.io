<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thomas Holm | Portfolio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #121212;
      --bg-surface: #1f1f1f;
      --bg-surface-2: #242424;
      --text-main: #e6e6e6;
      --text-muted: #b0b0b0;
      --gold: #d4af37;
      --border-subtle: rgba(255,255,255,0.08);
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* ===== NAV ===== */
    nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-link {
      color: var(--text-muted) !important;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: var(--gold) !important;
    }

    /* Dropdown menu */
    .dropdown-menu {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      margin-top: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .dropdown-item {
      color: var(--text-main);
    }

    .dropdown-item:hover {
      background: var(--bg-surface-2);
      color: var(--gold);
    }

    /* 🔥 HOVER OPEN (DESKTOP ONLY) */
    @media (min-width: 992px) {
      .nav-item.dropdown:hover > .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        display: block;
      }
    }

    /* Prevent Bootstrap blue focus */
    .nav-link:focus,
    .nav-link:active {
      color: var(--gold) !important;
      box-shadow: none;
      outline: none;
    }
  </style>
</head>

<body>

  <!-- Navigation -->
  <nav class="sticky-top">
    <div class="container py-2">
      <ul class="nav justify-content-center gap-4">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle"
             href="#"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">
            Services
          </a>

          <ul class="dropdown-menu text-center">
            <li><a class="dropdown-item" href="#">Gold Standard</a></li>
            <li><a class="dropdown-item" href="#">Silver Standard</a></li>
            <li><a class="dropdown-item" href="#">Bronze Standard</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Interior Service</a></li>
            <li><a class="dropdown-item" href="#">Exterior Service</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Add-Ons</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Projects</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>

      </ul>
    </div>
  </nav>

  <!-- Bootstrap JS (for mobile tap) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
