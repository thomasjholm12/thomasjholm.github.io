<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Standard Detailing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-main: #0f0f0f;
  --bg-card: #171717;
  --text-main: #e6e6e6;
  --text-muted: #9e9e9e;
  --gold: #d4af37;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, sans-serif;
  overflow-x: hidden;
}

/* ================= SPLASH ================= */

.splash {
  position: relative;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.splash video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.35) grayscale(100%) contrast(120%) blur(4px);
  transition: filter .6s ease;
}

.splash.dim video {
  filter: brightness(.25) grayscale(100%) contrast(130%) blur(5px);
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(212,175,55,.12),
    rgba(0,0,0,.85)
  );
}

.hero-logo {
  position: relative;
  width: clamp(500px, 70vw, 1200px);
  transition: opacity .6s ease, transform .6s ease;
  z-index: 2;
}

.hero-logo.fade-out {
  opacity: 0;
  transform: scale(.95);
}

/* ================= NAV ================= */

.navbar {
  position: fixed;
  width: 100%;
  top: 0;
  padding: 25px 0;
  background: transparent;
  transform: translateY(-100%);
  transition: transform .4s ease, background .4s ease, backdrop-filter .4s ease;
  z-index: 1000;
}

.navbar.visible {
  transform: translateY(0);
}

.navbar.scrolled,
.navbar.menu-open {
  background: rgba(15,15,15,.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

.nav-link {
  color: var(--text-muted) !important;
}

.nav-link:hover {
  color: var(--gold) !important;
}

/* ================= SERVICES PREVIEW ================= */

.services-preview {
  padding: 120px 0;
}

.service-card {
  background: var(--bg-card);
  border-radius: 20px;
  overflow: hidden;
  transition: transform .3s ease, box-shadow .3s ease;
  height: 100%;
}

.service-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(0,0,0,.6);
}

.service-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.service-content {
  padding: 25px;
}

.service-content h5 {
  color: var(--gold);
}

.gold-btn {
  display: inline-block;
  padding: 12px 28px;
  background: var(--gold);
  color: #000;
  font-weight: 600;
  border-radius: 40px;
  text-decoration: none;
  transition: transform .2s ease;
}

.gold-btn:hover {
  transform: scale(1.05);
  color: #000;
}

/* ================= FOOTER ================= */

footer {
  background: #1a1a1a;
  padding: 40px 0;
  text-align: center;
  font-size: .9rem;
  color: var(--text-muted);
}
</style>
</head>

<body>

<header class="splash">
  <video id="bgVideo" autoplay muted playsinline></video>
  <div class="overlay"></div>
  <img src="Banner.png" class="hero-logo" id="heroLogo" alt="Hero Logo">
</header>

<nav id="mainNav" class="navbar navbar-expand-lg">
  <div class="container justify-content-end">
    <ul class="navbar-nav gap-4">
      <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
    </ul>
  </div>
</nav>

<section class="services-preview">
  <div class="container text-center mb-5">
    <h2 class="display-5 fw-bold">Premium Detailing Services</h2>
    <p class="text-muted">Crafted for those who expect more.</p>
  </div>

  <div class="container text-center mt-5">
    <a href="services.html" class="gold-btn">View All Services</a>
  </div>
</section>

<footer>
  © <span id="year"></span> Gold Standard Detailing.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nav = document.getElementById("mainNav");
const heroLogo = document.getElementById("heroLogo");
const splash = document.querySelector(".splash");
const videoElement = document.getElementById("bgVideo");

/* ROTATING VIDEO SOURCES */
const videoSources = [
  "6159201-hd_1920_1080_30fps.mp4",
  "6159207-hd_1920_1080_30fps.mp4",
  "6158070-hd_1920_1080_30fps.mp4",
  "6157787-hd_1920_1080_30fps.mp4"
];

let currentVideo = 0;

function loadVideo(index) {
  videoElement.src = videoSources[index];
  videoElement.play();
}

videoElement.addEventListener("ended", () => {
  currentVideo = (currentVideo + 1) % videoSources.length;
  loadVideo(currentVideo);
});

/* Start first video */
loadVideo(currentVideo);

/* NAV SCROLL BEHAVIOR */
window.addEventListener("scroll", () => {

  if (window.scrollY > 50) {
    nav.classList.add("visible", "scrolled");
    heroLogo.classList.add("fade-out");
    splash.classList.add("dim");
  } else {
    nav.classList.remove("visible", "scrolled");
    heroLogo.classList.remove("fade-out");
    splash.classList.remove("dim");
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
