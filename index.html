<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Standard Detailing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-main: #0f0f0f;
  --bg-surface: #1a1a1a;
  --text-main: #e6e6e6;
  --text-muted: #9e9e9e;
  --gold: #d4af37;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, sans-serif;
  scroll-behavior: smooth;
  overflow-x: hidden;
}

/* ================= SPLASH ================= */

.splash {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.45);
  transition: filter .6s ease;
  z-index: 0;
}

.splash.dim video {
  filter: brightness(.30);
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(212,175,55,.12),
    rgba(0,0,0,.85)
  );
  z-index: 1;
}

/* ================= HERO LOGO ================= */

.hero-logo {
  position: relative;
  width: clamp(500px, 70vw, 1200px);
  transform: scale(1.2);
  opacity: 1;
  transition: opacity .6s ease, transform .6s ease;
  z-index: 2;
}

.hero-logo.fade-out {
  opacity: 0;
  transform: scale(.95);
}

/* ================= NAV ================= */

.navbar {
  position: fixed;
  width: 100%;
  top: 0;
  background: transparent;
  padding: 40px 0;
  transition: background .4s ease, padding .4s ease;
  z-index: 1000;
}

.navbar.scrolled {
  background: rgba(15,15,15,.95);
  backdrop-filter: blur(10px);
  padding: 25px 0;
  box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

/* Container relative so logo can position inside */
.navbar .container {
  position: relative;
}

/* BIG NAV LOGO */
.nav-logo {
  position: absolute;
  top: 50%;
  left: 40px;  /* desktop left */
  transform: translateY(-50%);
  height: 180px;  /* bigger than before */
  opacity: 0;
  transition: opacity .6s ease, transform .6s ease;
  pointer-events: none;
}

.nav-logo.visible {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}

/* NAV LINKS */
.nav-link {
  position: relative;
  color: var(--text-muted) !important;
  font-weight: 500;
  transition: color .2s ease;
}

.nav-link::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0%;
  height: 2px;
  background: var(--gold);
  transition: width .3s ease;
}

.nav-link:hover {
  color: var(--gold) !important;
}

.nav-link:hover::after {
  width: 100%;
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .hero-logo {
    width: 85vw;
    transform: scale(1);
  }

  .navbar {
    padding: 30px 0;
  }

  .navbar.scrolled {
    padding: 20px 0;
  }

  .nav-logo {
    left: 50%;
    transform: translate(-50%, -50%);
    height: 110px;  /* big but mobile-friendly */
  }

  .navbar-collapse {
    background: rgba(15,15,15,.98);
    padding: 20px;
  }
}

/* ================= CONTENT ================= */

section {
  padding: 120px 0;
}

.section-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 3rem;
}

footer {
  background: var(--bg-surface);
  padding: 40px 0;
  text-align: center;
  font-size: .9rem;
  color: var(--text-muted);
}
</style>
</head>

<body>

<header class="splash">
  <video autoplay muted loop playsinline>
    <source src="Detailvid.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <img src="Banner.png" class="hero-logo" id="heroLogo" alt="Hero Logo">
</header>

<nav id="mainNav" class="navbar navbar-expand-lg">
  <div class="container d-flex justify-content-end align-items-center">

    <!-- Big Nav Logo -->
    <img src="Simple_banner.png" class="nav-logo" id="navLogo" alt="Nav Logo">

    <button class="navbar-toggler text-light ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav gap-lg-4 text-center ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>

  </div>
</nav>

<section>
  <div class="container text-center">
    <h2 class="section-title">Our Standards</h2>
  </div>
</section>

<footer>
  © <span id="year"></span> Gold Standard Detailing.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nav = document.getElementById("mainNav");
const heroLogo = document.getElementById("heroLogo");
const navLogo = document.getElementById("navLogo");
const splash = document.querySelector(".splash");

window.addEventListener("scroll", () => {
  if (window.scrollY > 80) {
    nav.classList.add("scrolled");
    heroLogo.classList.add("fade-out");
    navLogo.classList.add("visible");
    splash.classList.add("dim");
  } else {
    nav.classList.remove("scrolled");
    heroLogo.classList.remove("fade-out");
    navLogo.classList.remove("visible");
    splash.classList.remove("dim");
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
