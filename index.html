<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Standard Detailing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-main: #0f0f0f;
  --bg-surface: #1a1a1a;
  --text-main: #e6e6e6;
  --text-muted: #9e9e9e;
  --gold: #d4af37;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, -apple-system, sans-serif;
  scroll-behavior: smooth;
  overflow-x: hidden;
}

/* ================= SPLASH ================= */

.splash {
  position: relative;
  height: 100vh;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}

.splash video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.45);
  z-index: 0;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(212,175,55,.12),
    rgba(0,0,0,.85)
  );
  z-index: 1;
}

/* ================= LOGO ================= */

.main-logo {
  position: relative;
  z-index: 2;
  width: clamp(500px, 70vw, 1200px);
  transform: scale(1.2);
  transition: 
    transform .6s ease,
    top .6s ease,
    left .6s ease;
}

/* When scrolling */
.main-logo.shrink {
  position: fixed;
  transform-origin: top left;
  z-index: 2000;
}

/* Desktop final anchor (aligned to navbar height) */
@media (min-width: 769px) {
  .main-logo.shrink {
    top: 12px;     /* matches navbar.scrolled padding */
    left: 20px;
    transform: scale(.35);
  }
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .main-logo {
    width: 85vw;
    transform: scale(1);
  }

  .main-logo.shrink {
    top: 10px;
    left: 50%;
    transform-origin: top center;
    transform: translateX(-50%) scale(.55);
  }

  .navbar-collapse {
    background: rgba(15,15,15,.98);
    padding: 20px;
  }
}

/* ================= NAV ================= */

.navbar {
  position: fixed;
  width: 100%;
  top: 0;
  background: transparent;
  transition: .4s ease;
  padding: 25px 0;
  z-index: 1000;
}

/* Shrunk nav */
.navbar.scrolled {
  background: rgba(15,15,15,.95);
  backdrop-filter: blur(10px);
  padding: 12px 0;
  box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

.nav-link {
  color: var(--text-muted) !important;
  font-weight: 500;
  transition: .2s ease;
}

.nav-link:hover {
  color: var(--gold) !important;
}

.navbar-toggler {
  border: none;
}

.navbar-toggler:focus {
  box-shadow: none;
}

/* ================= CONTENT ================= */

section {
  padding: 120px 0;
}

.section-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 3rem;
}

.card {
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,.06);
  transition: .25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 1rem 2rem rgba(0,0,0,.6);
}

.btn-gold {
  background: var(--gold);
  color: #000;
  font-weight: 600;
  border: none;
}

.btn-gold:hover {
  background: #c19b2c;
}

footer {
  background: var(--bg-surface);
  padding: 40px 0;
  text-align: center;
  font-size: .9rem;
  color: var(--text-muted);
}
</style>
</head>

<body>

<!-- SPLASH -->
<header class="splash">
  <video autoplay muted loop playsinline>
    <source src="Detailvid.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <img src="Banner.png" class="main-logo" id="mainLogo" alt="Gold Standard Logo">
</header>

<!-- NAVBAR -->
<nav id="mainNav" class="navbar navbar-expand-lg">
  <div class="container justify-content-end">

    <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav gap-lg-4 text-center">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<section>
  <div class="container text-center">
    <h2 class="section-title">Our Standards</h2>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-4 h-100">
          <h5>Gold Standard Detail</h5>
          <p class="text-secondary">Complete interior & exterior correction.</p>
          <button class="btn btn-gold mt-3">Learn More</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 h-100">
          <h5>Interior Restoration</h5>
          <p class="text-secondary">Deep cleaning and extraction.</p>
          <button class="btn btn-gold mt-3">Learn More</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 h-100">
          <h5>Exterior Protection</h5>
          <p class="text-secondary">Paint correction and coating.</p>
          <button class="btn btn-gold mt-3">Learn More</button>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>
  © <span id="year"></span> Gold Standard Detailing. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nav = document.getElementById("mainNav");
const logo = document.getElementById("mainLogo");

window.addEventListener("scroll", () => {
  if (window.scrollY > 80) {
    nav.classList.add("scrolled");
    logo.classList.add("shrink");
  } else {
    nav.classList.remove("scrolled");
    logo.classList.remove("shrink");
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
