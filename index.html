<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Standard Detailing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-main: #0f0f0f;
  --bg-surface: #1a1a1a;
  --text-main: #e6e6e6;
  --text-muted: #9e9e9e;
  --gold: #d4af37;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, sans-serif;
  scroll-behavior: smooth;
  overflow-x: hidden;
}

/* ================= SPLASH ================= */

.splash {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.45);
  z-index: 0;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(212,175,55,.12),
    rgba(0,0,0,.85)
  );
  z-index: 1;
}

/* ================= LOGO ================= */

.main-logo {
  position: relative;
  width: clamp(500px, 70vw, 1200px);
  transform: scale(1.2);
  transition:
    transform .6s ease,
    top .6s ease,
    left .6s ease,
    opacity .4s ease;
  z-index: 2;
}

/* Shrink state */
.main-logo.shrink {
  position: fixed;
  top: 0;                /* hard attach to top */
  left: 20px;            /* desktop default */
  transform-origin: top left;
  transform: scale(.35);
  opacity: .95;
  z-index: 2000;
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .main-logo {
    width: 85vw;
    transform: scale(1);
  }

  .main-logo.shrink {
    left: 50%;
    transform-origin: top center;
    transform: translateX(-50%) scale(.55);
  }

  .navbar-collapse {
    background: rgba(15,15,15,.98);
    padding: 20px;
  }
}

/* ================= NAV ================= */

.navbar {
  position: fixed;
  width: 100%;
  top: 0;
  background: transparent;
  padding: 25px 0;
  transition: .4s ease;
  z-index: 1000;
}

.navbar.scrolled {
  background: rgba(15,15,15,.95);
  backdrop-filter: blur(10px);
  padding: 10px 0;
  box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

.nav-link {
  color: var(--text-muted) !important;
  font-weight: 500;
  transition: .2s ease;
}

.nav-link:hover {
  color: var(--gold) !important;
}

.navbar-toggler {
  border: none;
}

.navbar-toggler:focus {
  box-shadow: none;
}

/* ================= CONTENT ================= */

section {
  padding: 120px 0;
}

.section-title {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 3rem;
}

footer {
  background: var(--bg-surface);
  padding: 40px 0;
  text-align: center;
  font-size: .9rem;
  color: var(--text-muted);
}
</style>
</head>

<body>

<header class="splash">
  <video autoplay muted loop playsinline>
    <source src="Detailvid.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <img src="Banner.png" class="main-logo" id="mainLogo" alt="Logo">
</header>

<nav id="mainNav" class="navbar navbar-expand-lg">
  <div class="container justify-content-end">
    <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav gap-lg-4 text-center">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section>
  <div class="container text-center">
    <h2 class="section-title">Our Standards</h2>
  </div>
</section>

<footer>
  © <span id="year"></span> Gold Standard Detailing.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nav = document.getElementById("mainNav");
const logo = document.getElementById("mainLogo");

window.addEventListener("scroll", () => {
  if (window.scrollY > 80) {
    nav.classList.add("scrolled");
    logo.classList.add("shrink");
  } else {
    nav.classList.remove("scrolled");
    logo.classList.remove("shrink");
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
