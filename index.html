<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Standard Detailing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --bg-main: #0f0f0f;
  --text-main: #e6e6e6;
  --text-muted: #9e9e9e;
  --gold: #d4af37;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: system-ui, sans-serif;
  overflow-x: hidden;
}

/* ================= SPLASH ================= */

.splash {
  position: relative;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.splash video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.45);
  transition: filter .6s ease;
}

.splash.dim video {
  filter: brightness(.3);
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(212,175,55,.12),
    rgba(0,0,0,.85)
  );
}

/* ================= HERO LOGO ================= */

.hero-logo {
  position: relative;
  width: clamp(500px, 70vw, 1200px);
  transition: opacity .6s ease, transform .6s ease;
  z-index: 2;
}

.hero-logo.fade-out {
  opacity: 0;
  transform: scale(.95);
}

/* ================= NAV ================= */

.navbar {
  position: fixed;
  width: 100%;
  top: 0;
  padding: 25px 0;
  background: transparent;
  transform: translateY(-100%);
  transition: transform .4s ease, background .4s ease, backdrop-filter .4s ease;
  z-index: 1000;
}

/* Navbar visible state */
.navbar.visible {
  transform: translateY(0);
}

/* Background styles when active */
.navbar.scrolled,
.navbar.menu-open {
  background: rgba(15,15,15,.95);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 25px rgba(0,0,0,.6);
}

/* NAV LOGO */

.nav-logo {
  position: absolute;
  top: 50%;
  left: 50px;
  height: 70px;
  transform: translateY(-50%) scale(3);
  transform-origin: left center;
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;
  z-index: 10;
}

.nav-logo.visible {
  opacity: 1;
}

/* NAV LINKS */

.nav-link {
  position: relative;
  color: var(--text-muted) !important;
  font-weight: 500;
  transition: color .2s ease;
}

.nav-link::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 0;
  width: 0%;
  height: 2px;
  background: var(--gold);
  transition: width .3s ease;
}

.nav-link:hover {
  color: var(--gold) !important;
}

.nav-link:hover::after {
  width: 100%;
}

/* HAMBURGER ANIMATION */

.navbar-toggler {
  border: none;
  position: absolute;
  right: 20px;
}

.navbar-toggler:focus {
  box-shadow: none;
}

.navbar-toggler-icon {
  background-image: none;
  width: 24px;
  height: 2px;
  background: white;
  position: relative;
  transition: all .3s ease;
}

.navbar-toggler-icon::before,
.navbar-toggler-icon::after {
  content: "";
  position: absolute;
  width: 24px;
  height: 2px;
  background: white;
  transition: all .3s ease;
}

.navbar-toggler-icon::before {
  top: -7px;
}

.navbar-toggler-icon::after {
  top: 7px;
}

.navbar-toggler.open .navbar-toggler-icon {
  background: transparent;
}

.navbar-toggler.open .navbar-toggler-icon::before {
  transform: rotate(45deg);
  top: 0;
}

.navbar-toggler.open .navbar-toggler-icon::after {
  transform: rotate(-45deg);
  top: 0;
}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .navbar {
    height: 80px;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .nav-logo {
    left: 50%;
    top: 50%;
    height: 60px;
    transform: translate(-50%, -50%) scale(2.5);
    transform-origin: center center;
  }

  .navbar-collapse {
    position: absolute;
    top: 80px;
    left: 0;
    width: 100%;
    background: rgba(15,15,15,.98);
    padding: 25px 0;
    transform: translateY(-10px);
    opacity: 0;
    transition: all .4s ease;
  }

  .navbar-collapse.show {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ================= CONTENT ================= */

section {
  padding: 120px 0;
}

footer {
  background: #1a1a1a;
  padding: 40px 0;
  text-align: center;
  font-size: .9rem;
  color: var(--text-muted);
}
</style>
</head>

<body>

<header class="splash">
  <video autoplay muted loop playsinline>
    <source src="Detailvid.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <img src="Banner.png" class="hero-logo" id="heroLogo" alt="Hero Logo">
</header>

<nav id="mainNav" class="navbar navbar-expand-lg">

  <img src="Simple_banner.png" class="nav-logo" id="navLogo" alt="Nav Logo">

  <div class="container d-flex justify-content-end align-items-center">

    <button class="navbar-toggler text-light ms-auto" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav gap-lg-4 text-center ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>

  </div>
</nav>

<section>
  <div class="container text-center">
    <h2 class="display-5 fw-bold">Our Standards</h2>
  </div>
</section>

<footer>
  © <span id="year"></span> Gold Standard Detailing.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const nav = document.getElementById("mainNav");
const heroLogo = document.getElementById("heroLogo");
const navLogo = document.getElementById("navLogo");
const splash = document.querySelector(".splash");
const navMenu = document.getElementById("navMenu");
const toggler = document.querySelector(".navbar-toggler");

/* SCROLL BEHAVIOR */
window.addEventListener("scroll", () => {

  if (window.scrollY > 50) {
    nav.classList.add("visible", "scrolled");
    heroLogo.classList.add("fade-out");
    navLogo.classList.add("visible");
    splash.classList.add("dim");
  } else {
    if (!navMenu.classList.contains("show")) {
      nav.classList.remove("visible", "scrolled");
      heroLogo.classList.remove("fade-out");
      navLogo.classList.remove("visible");
      splash.classList.remove("dim");
    }
  }
});

/* MENU OPEN */
navMenu.addEventListener("show.bs.collapse", function () {
  nav.classList.add("visible", "menu-open");
  navLogo.classList.add("visible");
  toggler.classList.add("open");
  document.body.style.overflow = "hidden";
});

/* MENU CLOSE */
navMenu.addEventListener("hide.bs.collapse", function () {
  nav.classList.remove("menu-open");
  toggler.classList.remove("open");
  document.body.style.overflow = "";

  if (window.scrollY <= 50) {
    nav.classList.remove("visible");
    navLogo.classList.remove("visible");
  }
});

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
