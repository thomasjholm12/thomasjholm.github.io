<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thomas Holm | Portfolio</title>
  <meta name="description" content="Website designed for the purposes of Gold Standard Detailing" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg-main: #121212;
      --bg-surface: #1f1f1f;
      --bg-surface-2: #242424;
      --text-main: #e6e6e6;
      --text-muted: #b0b0b0;
      --gold: #d4af37;
      --gold-muted: #bfa133;
      --border-subtle: rgba(255,255,255,0.08);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    .text-secondary {
      color: var(--text-muted) !important;
    }

    a {
      color: var(--gold);
    }

    a:hover {
      color: var(--gold-muted);
    }

    /* ===== Banner ===== */
    .banner-header {
      width: 100%;
      height: clamp(110px, 14vw, 220px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 24px);
    }

    .banner-img {
      width: 100%;
      max-width: 1400px;
      height: auto;
      object-fit: contain;
      object-position: center 45%;
      display: block;
    }

    /* ===== Navigation ===== */
    nav {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-link {
      color: var(--text-muted);
    }

    .nav-link.active,
    .nav-link:hover {
      color: var(--gold);
    }

    /* ===== Dropdown Styling ===== */
    .dropdown-menu {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
    }

    .dropdown-item {
      color: var(--text-muted);
    }

    .dropdown-item:hover,
    .dropdown-item:focus {
      background-color: var(--bg-surface-2);
      color: var(--gold);
    }

    .dropdown-toggle::after {
      border-top-color: var(--gold);
    }

    /* ===== Hero ===== */
    .hero {
      background: linear-gradient(
        180deg,
        rgba(212, 175, 55, 0.08),
        rgba(18, 18, 18, 0)
      );
    }

    /* ===== Cards ===== */
    .card {
      background-color: var(--bg-surface);
      color: var(--text-main);
    }

    .card-hover {
      transition: all 0.15s ease-in-out;
    }

    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.6);
    }

    /* ===== Buttons ===== */
    .btn-primary {
      background-color: var(--gold);
      border-color: var(--gold);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--gold-muted);
      border-color: var(--gold-muted);
      color: #000;
    }

    .btn-outline-primary {
      color: var(--gold);
      border-color: var(--gold);
    }

    .btn-outline-primary:hover {
      background-color: var(--gold);
      color: #000;
    }

    .btn-outline-secondary {
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }

    .btn-outline-secondary:hover {
      background-color: var(--bg-surface-2);
      color: var(--text-main);
    }

    /* ===== Icons ===== */
    .bi {
      color: var(--gold);
    }

    .btn .bi,
    .nav .bi {
      color: inherit;
    }

    /* ===== Footer ===== */
    footer {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>

<body>

  <img src="Banner.png" alt="Gold Standard Detailing Banner Logo" class="banner-img">
</header>
